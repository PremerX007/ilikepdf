name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  flutter:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test hook
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Verify bundled native runtimes
        shell: pwsh
        run: |
          $releaseDirectory = Resolve-Path "build/windows/x64/runner/Release"
          $requiredFiles = @(
            "ilikepdf.exe",
            "pdfium.dll",
            "runtime/qpdf/runtime-manifest.txt",
            "runtime/qpdf/bin/qpdf.exe",
            "runtime/qpdf/bin/qpdf30.dll",
            "runtime/qpdf/licenses/LICENSE.txt",
            "runtime/qpdf/licenses/NOTICE.md",
            "runtime/qpdf/provenance/qpdf-12.4.1.sha256",
            "runtime/qpdf/provenance/qpdf-12.4.1.sha256.sigstore"
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path (Join-Path $releaseDirectory $relativePath))) {
              throw "Release bundle is missing $relativePath"
            }
          }
          $env:ILIKEPDF_RELEASE_EXECUTABLE = Join-Path $releaseDirectory "ilikepdf.exe"
          cargo test --manifest-path ../../Cargo.toml -p ilikepdf_qpdf `
            --test release_runtime release_bundle_resolves_both_native_runtimes `
            -- --ignored --exact
      - run: flutter test integration_test/app_info_test.dart -d windows
      - run: flutter test integration_test/pdf_preview_test.dart -d windows
      - run: flutter test integration_test/image_to_pdf_test.dart -d windows
